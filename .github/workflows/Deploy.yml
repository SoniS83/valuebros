name: Docker CI/CD to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # This suppresses the Node 20 warning

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-static-site .

      - name: Save Docker Image as tar
        run: docker save my-static-site > site.tar

      - name: Copy Image to EC2
        uses: appleboy/scp-action@v1.0.0   # Updated to latest v1
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          source: "site.tar"
          target: "/home/ubuntu"
          strip_components: 0

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e  # Stop on any error
            docker load < /home/ubuntu/site.tar
            docker stop site || true
            docker rm site || true
            docker run -d -p 80:80 --name site my-static-site
            echo "✅ Deployment completed successfully!"
            docker ps | grep site
